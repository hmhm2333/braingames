<div id="core">
  <canvas id="scene" width="250" height="250" aria-hidden="true"></canvas>
  <div id="boat-plane">
  <button id="boat-hit" type="button" tabindex="-1" aria-label="小舢板，点船外回到任务" hidden></button>
  <div id="sites" role="group" aria-label="船上正在漏水的破口" hidden></div>
  <svg id="mast-clock" viewBox="0 0 64 36" role="img" aria-label="本题剩余时间"><defs><mask id="clock-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="36"><rect width="64" height="36" fill="white"></rect><image id="clock-occluder" x="-8" y="-28" width="80" height="96"></image></mask></defs><g mask="url(#clock-mask)"><path id="clock-track"></path><path id="clock-progress" pathLength="264" stroke-dasharray="264"></path></g></svg>
  <p id="lives" role="img" aria-label="还剩三次机会" hidden></p>
  <button id="move-whale" type="button" tabindex="-1" aria-label="长按鲸鱼娘移动补船区" title="长按鲸鱼娘拖动" hidden></button>
  </div>
</div>
<div id="lobby" class="lobby">
  <canvas id="companion" width="200" height="200" aria-hidden="true"></canvas>
  <section id="welcome" class="paper" hidden aria-labelledby="game-title">
    <h1 id="game-title" data-braingames-title data-pixel-text></h1>
    <div class="rules"><div><canvas id="rule-brick" width="72" height="64" aria-hidden="true"></canvas><span data-pixel-text>看这块板</span></div><div><canvas id="rule-sites" width="72" height="64" aria-hidden="true"></canvas><span data-pixel-text>点同形破口</span></div></div>
    <p data-braingames-controls></p>
    <button id="start" class="primary" type="button" data-pixel-text>补船</button>
  </section>
  <section id="result" class="paper" hidden aria-labelledby="game-result-title">
    <h2 id="game-result-title" data-braingames-title data-pixel-text></h2>
    <p id="result-lead" data-pixel-text>这次补好了</p>
    <p class="number"><strong id="result-value" data-pixel-text>0</strong><span data-pixel-text>块船板</span></p>
    <p class="best"><span data-pixel-text>最佳记录</span><span><strong id="best-value" data-pixel-text>0</strong><span data-pixel-text>块</span></span></p>
    <div class="actions"><button id="replay" class="primary" data-pixel-text>再补一趟</button><button id="random" class="secondary" data-pixel-text hidden>随机一个</button></div>
  </section>
  <section id="error" class="paper status" hidden role="alert"><p data-pixel-text>补板没拿稳。</p><p id="error-detail"></p><button id="reload" class="primary" data-pixel-text>重新载入</button></section>
  <section id="loading" class="paper status" role="status"><p data-pixel-text>鱼去拿补板了。</p><span class="loading-pixels" aria-hidden="true">▪ ▪ ▪</span></section>
</div>
<p id="announcement" class="sr-only" aria-live="polite"></p>

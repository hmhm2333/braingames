<canvas id="canvas" aria-hidden="true"></canvas>
<span id="current" class="pin" aria-label="气球位置" hidden></span>
<span id="target" class="pin" aria-label="星星位置" hidden></span>
<span id="heat" class="sr" role="meter" aria-label="气囊热度" aria-valuemin="0" aria-valuemax="100" hidden></span>
<span id="flight-status" class="sr"></span>
<div id="clouds" aria-label="可选的云" role="group"></div>
<button id="pilot" type="button" tabindex="-1" aria-label="移动鲸鱼娘" hidden></button>
<button id="resume" type="button" tabindex="-1" data-game-resume aria-label="点鲸鱼娘继续" hidden></button>
<div id="lobby" class="lobby" hidden>
<canvas id="companion" width="200" height="200" aria-hidden="true"></canvas>
<section id="welcome" class="paper" aria-labelledby="game-title" hidden>
  <h1 id="game-title" data-braingames-title data-pixel-text></h1>
  <div class="rules">
    <div><canvas id="rule-add" width="112" height="60" role="img" aria-label="从 (30,45) 加 (15,0)，飞到 (45,45)"></canvas><span id="rule-a" data-pixel-text></span></div>
    <div><canvas id="rule-subtract" width="112" height="60" role="img" aria-label="从 (45,45) 减 (5,0)，到 (40,45) 摘星"></canvas><span id="rule-b" data-pixel-text></span></div>
  </div>
  <p data-braingames-controls></p>
  <button id="start" class="primary" type="button" data-pixel-text></button>
</section>
<section id="result" class="paper" aria-labelledby="game-result-title" role="dialog" hidden>
  <h2 id="game-result-title" data-braingames-title data-pixel-text></h2>
  <p id="result-lead" data-pixel-text></p>
  <p class="number" aria-live="polite"><strong id="score" data-pixel-text>0</strong><span id="unit" data-pixel-text></span></p>
  <p class="best"><span id="best-label" data-pixel-text></span><span class="best-score"><strong id="best-value" data-pixel-text>0</strong><span data-pixel-text>颗</span></span></p>
  <div class="actions"><button id="replay" class="primary" type="button" data-pixel-text></button>
  <button id="random" class="secondary" type="button" data-pixel-text hidden></button></div>
</section>
<section id="error" class="paper" role="alert" hidden>
  <p id="load-error" data-pixel-text></p>
  <p id="error-detail"></p>
  <button id="reload" class="primary" type="button" data-pixel-text></button>
</section>
</div>
<span id="tip" hidden></span>
<p id="announce" class="sr" role="status" aria-live="polite"></p>
